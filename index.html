<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#F5F1E6;
    --shell:#EAE4D5;
    --card:#FBF8F0;
    --well:#EFE9DA;
    --ink:#2B2722;
    --ink-soft:#6E665A;
    --ink-mute:#8A8172;
    --ink-faint:#A79E8D;
    --line:#D8CFB8;
    --line-soft:#E3DCC8;
    --line-faint:#C9BFA6;
    --plum:#5B2A4A;
    --plum-lift:#7A3D65;
    --plum-wash:rgba(91,42,74,.06);
    --sage:#7C9473;
    --gold:#B08A2E;
    --danger:#8C3A34;
    --r:2px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--shell);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  input, select, button, textarea{ font-family:inherit; }
  ::selection{ background:rgba(91,42,74,.15); }
  :focus-visible{ outline:2px solid var(--plum); outline-offset:2px; }

  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ============================= SHELL ============================= */
  .app{
    display:flex; height:100vh; width:100vw;
    background:var(--paper); overflow:hidden;
  }

  .sidebar{
    width:214px; flex:none;
    border-right:1px solid var(--line);
    background:var(--card);
    display:flex; flex-direction:column;
    padding:26px 0;
    overflow-y:auto;
  }
  .brand{ padding:0 22px 24px; font-size:19px; font-weight:300; }

  .navlink{
    display:block; width:100%; text-align:left;
    padding:15px 22px; border:none; border-left:2px solid transparent;
    background:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.08em;
    color:var(--ink-soft);
  }
  .navlink:hover{ background:rgba(91,42,74,.04); }
  .navlink.active{ background:var(--plum-wash); border-left-color:var(--plum); color:var(--plum); }
  .navlink .count{ color:var(--ink-faint); }
  .navlink.active .count{ color:var(--plum); }

  .side-rule{ margin:24px 22px 0; height:1px; background:var(--line-soft); }
  .side-block{ padding:18px 22px; display:flex; flex-direction:column; gap:11px; }
  .side-label{
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:.1em; color:var(--ink-faint);
  }
  .saved-view{
    background:none; border:none; padding:0; text-align:left; cursor:pointer;
    font-size:14px; font-weight:300; color:var(--ink-soft);
  }
  .saved-view:hover{ color:var(--plum); }
  .saved-view.active{ color:var(--plum); font-weight:400; }

  .side-spacer{ flex:1; }
  .side-count{
    padding:0 22px; font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; line-height:1.6; letter-spacing:.06em; color:var(--line-faint);
  }
  .new-recipe{
    margin:14px 22px 0; height:50px;
    border:1px solid var(--plum); border-radius:var(--r); background:none;
    display:flex; align-items:center; justify-content:center; gap:9px;
    color:var(--plum); cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.08em;
  }
  .new-recipe:hover{ background:var(--plum-wash); }
  .data-actions{ display:flex; justify-content:center; gap:16px; margin:14px 22px 0; }
  .data-link{
    background:none; border:none; padding:0; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:.06em;
    color:var(--ink-faint);
  }
  .data-link:hover{ color:var(--plum); }

  main.stage{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .view{ display:none; flex:1; flex-direction:column; min-width:0; min-height:0; }
  .view.active{ display:flex; }

  /* ============================= SEARCH + FILTERS ============================= */
  .filter-head{
    padding:22px 30px 14px;
    display:flex; flex-direction:column; gap:14px;
    border-bottom:1px solid var(--line);
  }
  .searchbar{
    display:flex; align-items:center; gap:12px;
    height:50px; padding:0 16px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  }
  .searchbar:focus-within{ border-color:var(--plum); }
  .searchbar input{
    flex:1; min-width:0; border:none; outline:none; background:transparent;
    font-size:15px; font-weight:300; color:var(--ink);
  }
  .result-count{
    flex:none; font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:.1em; color:var(--ink-faint);
  }

  .filter-rows{ display:flex; flex-direction:column; gap:8px; }
  .filter-row{ display:flex; align-items:flex-start; gap:14px; }
  .filter-row-label{
    width:68px; flex:none; padding-top:7px;
    font-family:'IBM Plex Mono', monospace; font-size:10px; line-height:1;
    letter-spacing:.1em; color:var(--ink-faint);
  }
  .chips{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; flex:1; min-width:0; }

  .chip{
    padding:7px 12px; border:1px solid var(--line); background:none;
    color:var(--ink-soft); border-radius:var(--r); cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; line-height:1;
    letter-spacing:.06em;
  }
  .chip:hover{ border-color:var(--plum); color:var(--plum); }
  .chip.on{ border-color:var(--plum); background:var(--plum-wash); color:var(--plum); }
  .chip.removable{ display:flex; align-items:center; gap:8px; padding-right:10px; }
  .chip .x{ font-size:13px; line-height:1; }
  .chip.ghost{ border-style:dashed; border-color:var(--line-faint); color:var(--ink-faint); }
  .chip.ghost:hover{ border-color:var(--plum); color:var(--plum); }

  .kw-input{
    padding:6px 10px; border:1px solid var(--plum); border-radius:var(--r);
    background:var(--card); color:var(--ink);
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.06em;
    width:150px; outline:none;
  }

  .sort-wrap{ margin-left:auto; display:flex; align-items:center; gap:8px; flex:none; }
  select.sort{
    border:1px solid var(--line); border-radius:var(--r); background:var(--card);
    color:var(--ink-soft); padding:6px 8px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.06em;
  }

  /* ============================= RECIPE GRID ============================= */
  .grid{
    flex:1; min-height:0; overflow-y:auto;
    padding:20px 30px 26px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    grid-auto-rows:252px; gap:18px; align-content:start;
  }
  .rcard{
    position:relative;
    border:1px solid var(--line); background:var(--card); border-radius:var(--r);
    padding:12px; display:flex; flex-direction:column; gap:10px;
    cursor:pointer; text-align:left; overflow:hidden;
  }
  .rcard:hover{ border-color:var(--plum); }
  .rcard-shortlist{
    position:absolute; top:8px; right:8px; z-index:2;
    width:27px; height:27px; border-radius:50%;
    border:1px solid var(--line); background:rgba(251,248,240,.92);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; line-height:1; color:var(--ink-soft); cursor:pointer;
  }
  .rcard-shortlist:hover{ border-color:var(--plum); color:var(--plum); }
  .rcard-shortlist.on{ border-color:var(--sage); color:var(--sage); background:rgba(124,148,115,.14); }
  .rcard-photo{
    flex:1; min-height:0; border:1px solid var(--line-soft); background:var(--well);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    letter-spacing:.08em; color:var(--ink-faint);
  }
  .rcard-photo.empty{ border-style:dashed; background:none; }
  .rcard-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .rcard-tags{
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:.1em; color:var(--sage);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rcard-tags.bread{ color:var(--gold); }
  .rcard-tags.dessert{ color:var(--plum); }
  .rcard-title{
    font-size:19px; line-height:1.25; font-weight:300;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .rcard-rule{ height:1px; background:var(--line-soft); }
  .rcard-foot{
    display:flex; justify-content:space-between; gap:10px;
    font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:.06em; color:var(--ink-mute);
  }

  .grid-empty{
    grid-column:1/-1; padding:40px 0;
    font-size:16px; font-weight:300; color:var(--ink-faint);
  }
  .grid-empty p{ margin-bottom:16px; }

  /* ============================= VIEWER ============================= */
  .viewer-head{
    padding:22px 30px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .backlink{
    background:none; border:none; padding:0; cursor:pointer; color:var(--plum);
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em;
  }
  .backlink:hover{ color:var(--plum-lift); }
  .viewer-meta{
    flex:1; min-width:0;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:.08em; color:var(--ink-faint);
  }
  .viewer-body{ flex:1; min-height:0; overflow-y:auto; padding:22px 30px 40px; }

  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.06em;
    padding:9px 14px; border:1px solid var(--line); border-radius:var(--r);
    background:var(--card); color:var(--ink-soft); cursor:pointer;
  }
  .btn:hover{ border-color:var(--plum); color:var(--plum); }
  .btn.primary{ background:var(--plum); border-color:var(--plum); color:#fff; }
  .btn.primary:hover{ background:var(--plum-lift); color:#fff; }
  .btn.danger:hover{ border-color:var(--danger); color:var(--danger); }

  /* ============================= FLOW TABLE ============================= */
  .recipe-title{ font-size:26px; font-weight:300; margin-bottom:14px; }
  ol.setup{ list-style:none; margin-bottom:16px; display:flex; flex-direction:column; gap:6px; counter-reset:step; }
  ol.setup li{ counter-increment:step; display:flex; align-items:baseline; gap:10px; font-size:14.5px; }
  ol.setup li::before{
    content:counter(step); font-family:'IBM Plex Mono', monospace; font-size:10px;
    color:#fff; background:var(--ink-mute); width:18px; height:18px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center; flex:none;
  }
  .hint{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.08em;
    color:var(--ink-faint); margin-bottom:12px;
  }
  .tablewrap{
    overflow-x:auto; border:1px solid var(--line); border-radius:var(--r);
    background:var(--card); -webkit-overflow-scrolling:touch;
  }
  table{ border-collapse:separate; border-spacing:0; width:100%; min-width:560px; }
  td{ padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle; font-size:14.5px; line-height:1.4; }
  tr:last-child td{ border-bottom:none; }
  .ing-cell{
    position:sticky; left:0; background:var(--card); font-weight:400;
    border-right:1px solid var(--line-soft); min-width:190px; z-index:2; cursor:pointer;
  }
  .qty{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--plum);
    background:rgba(91,42,74,.09); padding:2px 6px; border-radius:var(--r);
    margin-right:6px; white-space:nowrap;
  }
  .box-cell{
    text-align:center; font-family:'IBM Plex Mono', monospace; font-size:12px;
    letter-spacing:.02em; min-width:135px; cursor:pointer; position:relative;
  }
  .box-cell.passthrough{ opacity:.55; border-left-style:dashed !important; }
  .blank-cell{ min-width:135px; }
  .ing-cell, .box-cell{ transition:opacity .15s ease; }
  .ing-cell.done, .box-cell.done{ opacity:.35; }
  .ing-cell.done::after, .box-cell.done::after{
    content:'✓'; position:absolute; top:6px; right:8px; width:18px; height:18px;
    border-radius:50%; background:var(--plum); color:#fff; font-size:10px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .ing-cell.done{ position:sticky; }
  ul.notes{ margin:18px 2px 0; padding-left:18px; color:var(--ink-soft); font-size:13.5px; line-height:1.7; }
  .errors{
    background:rgba(140,58,52,.07); border:1px solid rgba(140,58,52,.28);
    color:var(--danger); padding:12px 14px; border-radius:var(--r);
    font-size:13px; margin-bottom:14px;
  }
  .empty{ color:var(--ink-faint); font-size:14px; }

  /* ============================= PLACEHOLDER VIEWS ============================= */
  .stub{ padding:60px 30px; max-width:60ch; }
  .stub h1{ font-size:28px; font-weight:300; margin-bottom:12px; }
  .stub p{ color:var(--ink-soft); font-size:15px; line-height:1.7; }

  /* ============================= PLANNER ============================= */
  .planner-wrap{ flex:1; display:flex; min-height:0; }
  .planner-days{ flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:auto; padding:22px 30px 40px; }
  .planner-head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:2px; }
  .planner-head h1{ font-size:26px; font-weight:300; }
  .planner-rolls{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.08em; color:var(--ink-faint);
  }
  .week-label{
    margin:22px 0 4px; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase;
  }
  .week-label:first-of-type{ margin-top:16px; }

  .assign-banner{
    display:flex; align-items:center; gap:12px; justify-content:space-between;
    margin:14px 0 4px; padding:11px 16px;
    background:var(--plum-wash); border:1px solid var(--plum); border-radius:var(--r);
    font-size:13.5px; color:var(--plum);
  }
  .assign-banner button{
    background:none; border:none; color:var(--plum); cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.06em;
    text-decoration:underline; flex:none;
  }

  .day-row{
    display:flex; align-items:center; gap:16px;
    padding:14px 4px; border-bottom:1px solid var(--line-soft);
    cursor:default;
  }
  .day-row.assignable{ cursor:pointer; }
  .day-row.assignable:hover{ background:var(--plum-wash); }
  .day-row.today{ background:rgba(91,42,74,.045); }
  .day-num{
    width:78px; flex:none;
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.04em; color:var(--ink-mute);
  }
  .day-row.today .day-num{ color:var(--plum); font-weight:500; }
  .day-num .today-tag{ display:block; font-size:9.5px; letter-spacing:.08em; color:var(--plum); margin-top:2px; }

  .day-main{ flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
  .day-recipe-title{
    background:none; border:none; padding:0; text-align:left; cursor:pointer;
    font-size:18px; font-weight:300; color:var(--ink);
  }
  .day-recipe-title:hover{ color:var(--plum); }
  .day-choose{
    display:inline-flex; align-items:center; gap:8px; background:none; border:none; padding:0; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.06em; color:var(--plum);
  }
  .day-choose .circle{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--plum);
    display:flex; align-items:center; justify-content:center; font-size:14px; flex:none;
  }
  .day-away{ font-size:14px; font-style:italic; color:var(--ink-faint); }
  .day-clear{
    flex:none; background:none; border:none; cursor:pointer; color:var(--ink-faint);
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.06em;
  }
  .day-clear:hover{ color:var(--danger); }
  .day-time{
    flex:none; width:70px; text-align:right;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.03em; color:var(--ink-mute);
  }
  .day-time.dessert{ color:var(--gold); }

  .shortlist-panel{
    width:340px; flex:none; border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
    padding:22px 24px; overflow-y:auto;
  }
  .shortlist-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .shortlist-count{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.08em; color:var(--ink-faint);
  }
  .shortlist-input{
    width:100%; padding:13px 14px; border:1px solid var(--plum); border-radius:var(--r);
    background:none; color:var(--plum); font-size:14px; font-weight:300; outline:none; margin-bottom:8px;
  }
  .shortlist-input::placeholder{ color:var(--plum); opacity:.75; }
  .shortlist-caption{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:.06em;
    color:var(--ink-faint); margin-bottom:16px;
  }
  .shortlist-list{ display:flex; flex-direction:column; gap:10px; }

  .sl-item{
    border:1px solid var(--line); border-radius:var(--r); background:var(--card);
    padding:12px 14px; display:flex; flex-direction:column; gap:4px; cursor:pointer;
  }
  .sl-item:hover{ border-color:var(--plum); }
  .sl-item.selected{ border-color:var(--sage); background:rgba(124,148,115,.1); }
  .sl-item.note{
    border-style:dashed; cursor:default; background:none;
  }
  .sl-item.note:hover{ border-color:var(--line-faint); }
  .sl-row1{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sl-handle{ color:var(--ink-faint); font-size:13px; flex:none; }
  .sl-title{ font-size:15px; font-weight:400; flex:1; min-width:0; }
  .sl-title.quoted{ font-style:italic; font-weight:300; }
  .sl-remove{
    flex:none; background:none; border:none; cursor:pointer; color:var(--ink-faint);
    font-size:14px; line-height:1; padding:2px;
  }
  .sl-remove:hover{ color:var(--danger); }
  .sl-sub{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.06em; color:var(--ink-mute);
  }
  .sl-item.selected .sl-sub{ color:var(--sage); }
  .sl-empty{ font-size:13.5px; color:var(--ink-faint); line-height:1.6; }

  .shopping-preview{ margin-top:24px; padding-top:18px; border-top:1px solid var(--line-soft); }
  .shopping-preview-text{ font-size:14px; color:var(--ink-soft); margin:8px 0 10px; }
  #viewShoppingLink{ padding:0; }

  /* ============================= SHOPPING LIST ============================= */
  .shop-wrap{ flex:1; display:flex; flex-direction:column; min-height:0; padding:22px 30px 40px; overflow-y:auto; }
  .shop-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .shop-head h1{ font-size:26px; font-weight:300; margin-bottom:4px; }
  .shop-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.06em; color:var(--ink-faint); }
  .shop-head-right{ display:flex; align-items:center; gap:10px; flex:none; }
  #shopWeekSelect{ min-width:150px; }

  .shop-body{ display:flex; flex-direction:column; gap:28px; }
  .shop-category-title{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.1em;
    color:var(--ink-faint); margin-bottom:8px;
  }
  .shop-item{
    display:flex; align-items:flex-start; gap:12px;
    padding:10px 4px; border-bottom:1px solid var(--line-soft);
    cursor:pointer;
  }
  .shop-item input[type="checkbox"]{
    margin-top:3px; width:18px; height:18px; accent-color:var(--plum); cursor:pointer; flex:none;
  }
  .shop-item-main{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .shop-item-name{ font-size:15px; color:var(--ink); }
  .shop-item-recipes{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.04em; color:var(--ink-mute);
  }
  .shop-item.checked .shop-item-name{ text-decoration:line-through; color:var(--ink-faint); }
  .shop-item.checked .shop-item-recipes{ opacity:.6; }

  /* ============================= MODAL ============================= */
  .modal-overlay{
    posi
